<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Seller Orders — ReelMart</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"><style>
:root{--a:#F5A623;--d:#0E0E0E;--s:#181818;--s2:#202020;--t:#F0EEE8;--t2:#929292;--g:#3DAA6A;--b:#60A5FA;--p:#A78BFA;--e:#E8522A}*{box-sizing:border-box;margin:0}body{font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 80% 10%,rgba(245,166,35,.08),transparent 30%),var(--d);color:var(--t);min-height:100vh}nav{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;background:#101010;position:sticky;top:0;z-index:20}.logo{font:900 25px 'Playfair Display',serif;color:var(--t);text-decoration:none}.logo span{color:var(--a)}.links{display:flex;gap:20px}.links a{color:var(--t2);text-decoration:none;font-size:13px}.links a:hover,.links a.active{color:var(--a)}main{max-width:1180px;margin:auto;padding:38px 22px 70px}.eyebrow{color:var(--a);font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.title{font:700 42px 'Playfair Display',serif;margin:6px 0}.sub{color:var(--t2);font-size:14px;margin-bottom:26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{background:linear-gradient(145deg,#1d1d1d,#151515);border:1px solid #292929;border-radius:15px;padding:18px}.stat small{color:var(--t2);font-size:11px}.stat strong{display:block;font-size:27px;margin-top:7px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.search,.filter{background:#171717;color:var(--t);border:1px solid #303030;border-radius:11px;padding:12px 14px;outline:none}.search{flex:1}.filter{min-width:170px}.card{background:var(--s);border:1px solid #2a2a2a;border-radius:17px;margin-bottom:14px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.18)}.head{display:flex;justify-content:space-between;gap:15px;padding:17px 19px;border-bottom:1px solid #262626}.orderNo{color:var(--a);font-weight:700}.muted{color:var(--t2);font-size:11px;margin-top:4px}.badge{padding:7px 11px;border-radius:20px;font-size:11px;background:rgba(245,166,35,.13);color:var(--a);height:max-content}.body{padding:18px 19px;display:grid;grid-template-columns:1fr 290px;gap:20px}.item{display:flex;gap:13px;padding:10px 0;border-bottom:1px solid #242424}.img{width:66px;height:66px;border-radius:10px;overflow:hidden;background:#242424;flex:none;display:grid;place-items:center}.img img{width:100%;height:100%;object-fit:cover}.iname{font-weight:600}.meta{font-size:11px;color:var(--t2);margin-top:5px;line-height:1.7}.price{margin-left:auto;color:var(--a);font-weight:700}.customer{background:#141414;border:1px solid #292929;border-radius:13px;padding:15px}.customer h3{font-size:13px;margin-bottom:10px}.customer p{font-size:12px;color:var(--t2);line-height:1.7}.customer b{color:var(--t)}.actions{display:flex;gap:8px;margin-top:15px}.actions select{background:#171717;color:var(--t);border:1px solid #383838;border-radius:9px;padding:9px 12px}.empty,.loading{text-align:center;padding:65px;color:var(--t2)}.btn{display:inline-block;border:0;border-radius:9px;padding:9px 13px;background:var(--a);color:#111;font-weight:700;cursor:pointer;text-decoration:none}.error{color:#ff9b7f}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.body{grid-template-columns:1fr}.title{font-size:34px}}@media(max-width:520px){.links{display:none}.toolbar{flex-direction:column}.filter{width:100%}}</style></head><body><nav><a class="logo" href="/">Reel<span>Mart</span></a><div class="links"><a href="/seller_dashboard.html">Seller Dashboard</a><a class="active" href="/seller_orders.html">Orders</a><a href="/orders.html">Customer Orders</a><a href="/">Store</a></div></nav><main><div class="eyebrow">Seller workspace</div><h1 class="title">Manage orders.</h1><p class="sub">Review purchases containing your products and move them through fulfilment.</p><section class="stats"><div class="stat"><small>ALL ORDERS</small><strong id="all">0</strong></div><div class="stat"><small>PENDING</small><strong id="pending">0</strong></div><div class="stat"><small>SHIPPED</small><strong id="shipped">0</strong></div><div class="stat"><small>DELIVERED</small><strong id="delivered">0</strong></div></section><div class="toolbar"><input id="search" class="search" placeholder="Search order number or customer..."><select id="filter" class="filter"><option value="all">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div id="orders"><div class="loading">Loading seller orders...</div></div></main><script>const token=localStorage.getItem('reelmartToken'),user=JSON.parse(localStorage.getItem('reelmartUser')||'null');let orders=[];if(!token||!user||!['seller','admin'].includes(user.role)){document.getElementById('orders').innerHTML='<div class="empty">🔒 Seller access required.<br><br><a class="btn" href="/auth.html?returnTo=%2Fseller_orders.html">Sign in</a></div>';throw new Error('seller access required')}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₦'+Number(v||0).toLocaleString();function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const list=orders.filter(o=>(!q||String(o.orderNumber).toLowerCase().includes(q)||String(o.user?.fullName||'').toLowerCase().includes(q)||String(o.user?.email||'').toLowerCase().includes(q))&&(f==='all'||o.status===f));document.getElementById('orders').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching seller orders.</div>'}function card(o){return '<article class="card"><div class="head"><div><div class="orderNo">Order #'+esc(o.orderNumber||o._id)+'</div><div class="muted">'+new Date(o.createdAt).toLocaleString('en-NG')+' · '+esc(o.user?.fullName||o.fullName)+'</div></div><div class="badge">'+esc(o.status)+'</div></div><div class="body"><div>'+(o.sellerItems||[]).map(i=>'<div class="item"><div class="img">'+(i.image?'<img src="'+(i.image.startsWith('http')?i.image:'/uploads/'+i.image)+'" onerror="this.style.display='none'">':'📦')+'</div><div><div class="iname">'+esc(i.name)+'</div><div class="meta">Qty: '+i.quantity+'</div></div><div class="price">'+money(i.price*i.quantity)+'</div></div>').join('')+'<div style="display:flex;justify-content:space-between;margin-top:14px;font-weight:700"><span>Seller subtotal</span><span style="color:var(--a)">'+money(o.sellerSubtotal)+'</span></div><div class="actions"><select onchange="changeStatus(''+o._id+'',this.value)"><option value="pending" '+(o.status==='pending'?'selected':'')+'>Pending</option><option value="confirmed" '+(o.status==='confirmed'?'selected':'')+'>Confirmed</option><option value="shipped" '+(o.status==='shipped'?'selected':'')+'>Shipped</option><option value="delivered" '+(o.status==='delivered'?'selected':'')+'>Delivered</option><option value="cancelled" '+(o.status==='cancelled'?'selected':'')+'>Cancelled</option></select></div></div><aside class="customer"><h3>Customer</h3><p><b>'+esc(o.user?.fullName||o.fullName)+'</b><br>'+esc(o.user?.email||'')+'<br>'+esc(o.phone)+'<br><br><b>Delivery</b><br>'+esc(o.address)+'<br>'+esc(o.city)+', '+esc(o.state)+'</p><p style="margin-top:12px"><b>Payment:</b> '+esc(o.paymentStatus||'pending')+'<br><b>Method:</b> '+esc(o.paymentMethod||'card')+'<br><b>Order total:</b> '+money(o.totalAmount)+'</p></aside></div></article>'}async function load(){try{const r=await fetch('/api/orders/seller',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw new Error(d.message||'Could not load orders');orders=d.orders||[];document.getElementById('all').textContent=orders.length;document.getElementById('pending').textContent=orders.filter(o=>o.status==='pending').length;document.getElementById('shipped').textContent=orders.filter(o=>o.status==='shipped').length;document.getElementById('delivered').textContent=orders.filter(o=>o.status==='delivered').length;render()}catch(e){document.getElementById('orders').innerHTML='<div class="empty error">⚠️ '+esc(e.message)+'<br><br><button class="btn" onclick="load()">Try again</button></div>'}}async function changeStatus(id,status){try{const r=await fetch('/api/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})}),d=await r.json();if(!r.ok)throw new Error(d.message||'Could not update status');await load()}catch(e){alert(e.message);await load()}}document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);load();</script></body></html>
