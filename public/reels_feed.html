
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --accent: #F5A623;
  --accent2: #E8522A;
  --dark: #141414;
  --surface: #1E1E1E;
  --surface2: #2A2A2A;
  --text: #F0EEE8;
  --text2: #AAAAAA;
}

body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); }

#app { display: flex; height: 620px; overflow: hidden; }

/* --- LEFT NAV --- */
.sidenav {
  width: 64px;
  background: #111;
  border-right: 0.5px solid #2A2A2A;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 8px;
  flex-shrink: 0;
}

.logo-s {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

.snav-btn {
  width: 44px; height: 44px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 20px;
  transition: background 0.15s, color 0.15s;
  flex-direction: column;
  gap: 2px;
}
.snav-btn:hover { background: var(--surface2); color: var(--text); }
.snav-btn.active { background: rgba(245,166,35,0.12); color: var(--accent); }
.snav-btn span { font-size: 9px; font-family: 'DM Sans', sans-serif; }

/* --- REEL FEED --- */
.feed {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #000;
}

.reel-viewport {
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.reel-viewport::-webkit-scrollbar { display: none; }

.reel-slide {
  height: 620px;
  scroll-snap-align: start;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
}

.reel-bg-full {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bg1 { background: radial-gradient(ellipse at 60% 40%, #4A1A6A 0%, #1A0A2A 60%, #0A0A14 100%); }
.bg2 { background: radial-gradient(ellipse at 40% 60%, #1A4A2A 0%, #0A1E14 60%, #060E0A 100%); }
.bg3 { background: radial-gradient(ellipse at 60% 50%, #4A1A10 0%, #1E0A06 60%, #0E0604 100%); }
.bg4 { background: radial-gradient(ellipse at 50% 40%, #1A2A4A 0%, #0A1220 60%, #050810 100%); }
.bg5 { background: radial-gradient(ellipse at 55% 45%, #3A1A3A 0%, #180A18 60%, #0A040A 100%); }

.reel-emoji-big {
  font-size: 110px;
  filter: drop-shadow(0 0 40px rgba(255,255,255,0.08));
  animation: floatAnim 3s ease-in-out infinite;
  user-select: none;
}

@keyframes floatAnim {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.paused .reel-emoji-big { animation-play-state: paused; }

/* Pause indicator */
.pause-indicator {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.paused .pause-indicator { opacity: 1; }
.pause-circle {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
}

/* Progress bar */
.progress-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: rgba(255,255,255,0.15);
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;

  border-radius: 0 2px 2px 0;
}

/* Top bar */
.reel-topbar {

  top: 14px; left: 14px; right: 14px;

.live-pill {

}
.live-dot {

.view-count {

/* Bottom product info */
.reel-bottom {

}

.seller-row {

/* Toast */
.toast {

.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>

<script>
// ── State ────────────────────────────────────────────────────
let products   = [];
let paused     = [];
let progress   = [];
let timers     = [];
let liked      = [];
let currentSlide = 0;

const viewport = document.getElementById('viewport');

// ── Emoji fallbacks for products without images ──────────────
const EMOJIS = ['👟','👜','⌚','🕶️','👗','🎒','👞','💄','🧴','📱'];
const COLORS = [
  ['#4A1A6A','#1A0A2A'],['#1A3A5A','#060A14'],['#3A1A1A','#140606'],
  ['#1A4040','#061414'],['#3A2A1A','#140E06'],['#1A1A4A','#060614'],
];

// ── Load real products from API ──────────────────────────────
async function loadReels() {
  try {
    const res  = await fetch('/api/products');
    const data = await res.json();
    products   = Array.isArray(data) ? data : (data.products || data.data || []);

    if (!products.length) {
      viewport.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;
                    height:100%;color:#aaa;flex-direction:column;gap:12px;">
          <div style="font-size:48px;">📦</div>
          <div>No products yet. Add some from the seller dashboard.</div>
          <button onclick="window.location.href='/pages/seller_dashboard.html'"
            style="background:var(--accent);color:#111;border:none;padding:10px 20px;
                   border-radius:20px;cursor:pointer;font-size:13px;">
            Add Products
          </button>
        </div>`;
      return;
    }

    // Initialise state arrays
    paused   = Array(products.length).fill(false);
    progress = Array(products.length).fill(0);
    timers   = Array(products.length).fill(null);
    liked    = Array(products.length).fill(false);

    // Build slides
    viewport.innerHTML = products.map((p, i) => buildSlide(p, i)).join('');

    // Render right-panel cart
    renderCartPanel();

    // Start first reel progress
    startProgress(0);

    // Scroll listener
    viewport.addEventListener('scroll', onScroll);

  } catch (err) {
    console.error('Failed to load products:', err);
    viewport.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;
                  height:100%;color:#E8522A;flex-direction:column;gap:8px;">
        <div style="font-size:32px;">⚠️</div>
        <div>Could not load products. Is the server running?</div>
      </div>`;
  }
}

// ── Build one reel slide from a product ──────────────────────
function buildSlide(p, i) {
  const emoji   = EMOJIS[i % EMOJIS.length];
  const [c1,c2] = COLORS[i % COLORS.length];

  // Use video if available, otherwise fall back to image
  const videoSrc = p.reelVideo
    ? (p.reelVideo.startsWith('http') ? p.reelVideo : '/uploads/' + p.reelVideo)
    : null;
  const imgSrc = p.image
    ? (p.image.startsWith('http') ? p.image : '/uploads/' + p.image)
    : null;

  const mediaHTML = videoSrc
    ? `<video
          src="${videoSrc}"
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"
          loop
          muted
          playsinline
          preload="metadata"
          id="video-${i}">
       </video>`
    : imgSrc
      ? `<img src="${imgSrc}"
              alt="${p.name}"
              style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.85;">`
      : '';

  const imgHTML = mediaHTML;
  const sellerInitials = (p.sellerName || 'RM').substring(0,2).toUpperCase();
  const views = p.totalSold ? (p.totalSold > 999 ? (p.totalSold/1000).toFixed(1)+'K' : p.totalSold) : '0';
  const price  = Number(p.price || 0).toLocaleString();
  const oldPriceHTML = p.oldPrice
    ? `<span class="reel-old-price">₦${Number(p.oldPrice).toLocaleString()}</span>` : '';

  return `
  <div class="reel-slide" id="slide-${i}" onclick="togglePause(${i})">
    <div class="reel-bg-full" style="background:radial-gradient(ellipse at 60% 40%, ${c1}, ${c2});">
      ${imgHTML}
      <span class="reel-emoji-big" ${p.image ? 'style="display:none"' : ''}>${emoji}</span>
    </div>
    <div class="pause-indicator">
      <div class="pause-circle">
        <i class="ti ti-player-pause" style="font-size:22px;color:white"></i>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-${i}"></div></div>
    <div class="reel-topbar">
      <div class="live-pill">🔥 Trending</div>
      <div class="view-count">👁 ${views} views</div>
    </div>
    <div class="reel-bottom">
      <div class="seller-row">
        <div class="seller-avatar" style="background:var(--accent);color:#111">${sellerInitials}</div>
        <span class="seller-name">@${(p.sellerName || 'reelmart').toLowerCase().replace(/\s+/g,'_')}</span>
        <button class="follow-btn" onclick="toggleFollow(event,this)">+ Follow</button>
      </div>
      <div class="reel-product-title">${p.name}</div>
      <div class="reel-desc">${(p.description || '').substring(0, 120)}${p.description && p.description.length > 120 ? '…' : ''}</div>
      <div class="reel-price-row">
        <span class="reel-price">₦${price}</span>
        ${oldPriceHTML}
        <span style="font-size:10px;color:${p.stock > 0 ? 'var(--accent)' : '#E8522A'}">
          ${p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'}
        </span>
      </div>
      <div class="reel-actions-row">
        <button class="add-cart-btn"
          onclick="addToCart(event,'${p._id}','${p.name.replace(/'/g,"\'")}',${p.price},'${p.image||''}')"
          ${p.stock === 0 ? 'disabled style="opacity:0.4"' : ''}>
          🛒 Add to cart
        </button>
        <button class="wishlist-btn" onclick="toggleLike(event,this,${i})">
          <i class="ti ti-heart" style="font-size:17px"></i>
        </button>
      </div>
    </div>
    <div class="reel-side">
      <div class="side-action" onclick="toggleLike(event,document.querySelector('#slide-${i} .wishlist-btn'),${i})">
        <div class="side-icon" id="like-icon-${i}">
          <i class="ti ti-heart" style="font-size:18px"></i>
        </div>
        <span class="side-label" id="like-ct-${i}">
          ${p.totalSold || 0}
        </span>
      </div>
      <div class="side-action" onclick="shareReel('${p.name.replace(/'/g,"\'")}')">
        <div class="side-icon"><i class="ti ti-share" style="font-size:18px"></i></div>
        <span class="side-label">Share</span>
      </div>
      <div class="side-action" onclick="saveReel(event,'${p._id}')">
        <div class="side-icon" id="save-icon-${i}">
          <i class="ti ti-bookmark" style="font-size:18px"></i>
        </div>
        <span class="side-label">Save</span>
      </div>
      <div class="side-action" onclick="openProduct(event,'${p._id}')">
        <div class="side-icon"><i class="ti ti-info-circle" style="font-size:18px"></i></div>
        <span class="side-label">Details</span>
      </div>
    </div>
  </div>`;
}

// ── Progress bar ─────────────────────────────────────────────
function playVideo(idx) {
  const video = document.getElementById('video-' + idx);
  if (video) video.play().catch(() => {});
}

function pauseVideo(idx) {
  const video = document.getElementById('video-' + idx);
  if (video) video.pause();
}

function startProgress(idx) {
  if (timers[idx]) clearInterval(timers[idx]);
  playVideo(idx);
  timers[idx] = setInterval(() => {
    if (!paused[idx]) {
      progress[idx] = Math.min(progress[idx] + 0.4, 100);
      const fill = document.getElementById('prog-' + idx);
      if (fill) fill.style.width = progress[idx] + '%';
      if (progress[idx] >= 100) {
        clearInterval(timers[idx]);
        progress[idx] = 0;
        pauseVideo(idx);
        const next = idx + 1;
        if (next < products.length) scrollToReel(next);
        else scrollToReel(0);
      }
    }
  }, 80);
}

function stopProgress(idx) {
  if (timers[idx]) clearInterval(timers[idx]);
  pauseVideo(idx);
}

function togglePause(idx) {
  paused[idx] = !paused[idx];
  const slide = document.getElementById('slide-' + idx);
  if (slide) {
    if (paused[idx]) {
      slide.classList.add('paused');
      pauseVideo(idx);
    } else {
      slide.classList.remove('paused');
      playVideo(idx);
    }
  }
}

function scrollToReel(idx) {
  stopProgress(currentSlide);
  progress[currentSlide] = 0;
  const fill = document.getElementById('prog-' + currentSlide);
  if (fill) fill.style.width = '0%';
  currentSlide = idx;
  viewport.scrollTo({ top: idx * 620, behavior: 'smooth' });
  setTimeout(() => startProgress(idx), 400);
}

function onScroll() {
  const idx = Math.round(viewport.scrollTop / 620);
  if (idx !== currentSlide && idx >= 0 && idx < products.length) {
    stopProgress(currentSlide);
    currentSlide = idx;
    startProgress(idx);
  }
}

// ── Like / Follow ────────────────────────────────────────────
function toggleLike(e, btn, idx) {
  e.stopPropagation();
  liked[idx] = !liked[idx];
  const icon = document.getElementById('like-icon-' + idx);
  const ct   = document.getElementById('like-ct-' + idx);
  if (liked[idx]) {
    if (icon) icon.classList.add('liked');
    if (btn)  btn.classList.add('liked');
    if (ct)   ct.textContent = (parseInt(ct.textContent) || 0) + 1;
    showToast('Liked! ♥');
  } else {
    if (icon) icon.classList.remove('liked');
    if (btn)  btn.classList.remove('liked');
    if (ct)   ct.textContent = Math.max((parseInt(ct.textContent) || 1) - 1, 0);
  }
}

function toggleFollow(e, btn) {
  e.stopPropagation();
  const following = btn.classList.toggle('following');
  btn.textContent = following ? '✓ Following' : '+ Follow';
  if (following) showToast('Now following this seller!');
}

// ── Cart ─────────────────────────────────────────────────────
function addToCart(e, id, name, price, image) {
  e.stopPropagation();
  let cart = JSON.parse(localStorage.getItem('reelmartCart')) || [];
  const existing = cart.find(item => item._id === id);
  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({ _id: id, name, price: Number(price), image, quantity: 1 });
  }
  localStorage.setItem('reelmartCart', JSON.stringify(cart));
  renderCartPanel();
  showToast(name + ' added to cart! 🛒');
}

function renderCartPanel() {
  const cart  = JSON.parse(localStorage.getItem('reelmartCart')) || [];
  const list  = document.getElementById('cart-items-list');
  const totalRow  = document.getElementById('cart-total-row');
  const totalVal  = document.getElementById('cart-total-val');
  const checkoutBtn = document.getElementById('checkout-btn');

  if (!list) return;

  if (cart.length === 0) {
    list.innerHTML = '<div class="empty-cart">No items yet</div>';
    if (totalRow)    totalRow.style.display = 'none';
    if (checkoutBtn) checkoutBtn.style.display = 'none';
    return;
  }

  const total = cart.reduce((s,i) => s + i.price * i.quantity, 0);
  const last3 = cart.slice(-3);

  list.innerHTML = last3.map(item => `
    <div class="cart-item-row">
      <span class="cart-item-name">${item.name} x${item.quantity}</span>
      <span class="cart-item-price">₦${(item.price * item.quantity).toLocaleString()}</span>
    </div>`).join('');

  if (cart.length > 3) {
    list.innerHTML += `<div style="font-size:10px;color:var(--text2);margin-top:2px">
      +${cart.length - 3} more items</div>`;
  }

  if (totalVal)    totalVal.textContent = '₦' + total.toLocaleString();
  if (totalRow)    totalRow.style.display = 'flex';
  if (checkoutBtn) {
    checkoutBtn.style.display = 'block';
    checkoutBtn.onclick = () => window.location.href = '/checkout.html';
  }
}

// ── Details / Share / Save ───────────────────────────────────
function openProduct(e, id) {
  e.stopPropagation();
  window.location.href = '/product.html?id=' + id;
}

function shareReel(name) {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: name + ' on ReelMart', url });
  } else {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied!'));
  }
}

function saveReel(e, id) {
  e.stopPropagation();
  let saved = JSON.parse(localStorage.getItem('reelmartSaved')) || [];
  if (!saved.includes(id)) {
    saved.push(id);
    localStorage.setItem('reelmartSaved', JSON.stringify(saved));
    showToast('Saved to wishlist! 🔖');
  } else {
    showToast('Already saved!');
  }
}

function filterChip(el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  showToast('Filter: ' + el.textContent);
}

// ── Toast ────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Boot ─────────────────────────────────────────────────────
loadReels();
</script>
