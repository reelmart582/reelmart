<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | ReelMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#F5A623;--accent2:#E8522A;--dark:#0b0c10;--surface:#15171d;--surface2:#1e2129;--text:#f5f2ea;--text2:#9da3ae;--line:rgba(255,255,255,.08);--green:#74c69d}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
button{font:inherit}
#app{min-height:100vh}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--line);background:rgba(11,12,16,.85);backdrop-filter:blur(15px);position:sticky;top:0;z-index:30}.logo{font:900 24px 'Playfair Display',serif}.logo span{color:var(--accent)}.back{border:1px solid var(--line);background:var(--surface);color:var(--text2);padding:9px 14px;border-radius:20px;cursor:pointer}.cart{border:0;background:var(--accent);color:#111;padding:9px 17px;border-radius:20px;font-weight:700;cursor:pointer}
.page{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(420px,1.05fr);gap:36px;max-width:1250px;margin:auto;padding:35px 4vw 70px}.media-panel{position:sticky;top:100px;align-self:start}.main-media{height:min(650px,68vh);min-height:420px;border-radius:25px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 30%,#313644,#101116);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.3)}.main-media img,.main-media video{width:100%;height:100%;object-fit:cover;display:block}.media-fallback{height:100%;display:grid;place-items:center;font-size:100px;color:var(--accent)}.reel-pill{position:absolute;top:15px;left:15px;background:rgba(232,82,42,.92);color:#fff;padding:7px 11px;border-radius:20px;font-size:10px;text-transform:uppercase;letter-spacing:.8px}.thumbs{display:flex;gap:9px;margin-top:10px;overflow:auto}.thumb{width:70px;height:70px;flex:0 0 70px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);cursor:pointer}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.breadcrumb{font-size:11px;color:var(--text2);margin:5px 0 17px}.category{color:var(--accent);text-transform:uppercase;letter-spacing:1.2px;font-size:10px;margin-bottom:9px}.title{font:900 clamp(34px,4vw,54px)/1.03 'Playfair Display',serif;letter-spacing:-1.4px;margin-bottom:16px}.description{color:var(--text2);line-height:1.8;font-size:14px;max-width:680px;margin-bottom:23px}.price{font:900 34px 'Playfair Display',serif;color:var(--accent)}.price-row{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.stock{font-size:11px;color:var(--green)}.stock.out{color:var(--accent2)}
.seller{display:flex;align-items:center;gap:11px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:20px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(245,166,35,.14);color:var(--accent);font-weight:700}.seller-name{font-weight:600;font-size:13px}.seller-meta{color:var(--text2);font-size:10px;margin-top:2px}
.config-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.config-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px}.options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.option{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text2);cursor:pointer;font-size:12px}.option.active,.option:hover{border-color:var(--accent);color:var(--accent);background:rgba(245,166,35,.08)}
.qty-row{display:flex;align-items:center;gap:14px;margin:22px 0}.qty{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}.qty button{width:38px;height:38px;border:0;background:transparent;color:var(--text);cursor:pointer}.qty span{width:38px;display:grid;place-items:center;border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:13px}
.actions{display:flex;gap:9px;margin-bottom:23px}.add,.buy{flex:1;border-radius:28px;padding:14px;border:0;cursor:pointer;font-weight:700}.add{background:var(--accent);color:#111}.buy{background:transparent;border:1px solid var(--line);color:var(--text)}.add:hover,.buy:hover{transform:translateY(-2px)}.wish{width:50px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}.wish.active{color:var(--accent2);border-color:var(--accent2)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:25px}.info-card{background:var(--surface);border:1px solid var(--line);padding:13px;border-radius:13px}.info-card strong{display:block;font-size:12px;margin-bottom:3px}.info-card span{font-size:10px;color:var(--text2);line-height:1.5}.details{border-top:1px solid var(--line);padding-top:20px}.details h2{font:700 23px 'Playfair Display',serif;margin-bottom:11px}.attributes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.attr{display:flex;justify-content:space-between;gap:10px;background:var(--surface);padding:10px;border-radius:9px;font-size:11px}.attr span:first-child{color:var(--text2)}.empty-details{color:var(--text2);font-size:12px;line-height:1.7}.reviews{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}.reviews h2{font:700 23px 'Playfair Display',serif;margin-bottom:8px}.reviews p{color:var(--text2);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);opacity:0;background:var(--accent);color:#111;padding:11px 20px;border-radius:25px;font-size:12px;font-weight:700;transition:.25s;z-index:100}.toast.show{transform:translate(-50%,0);opacity:1}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--text2)}
.error{max-width:600px;margin:80px auto;text-align:center;padding:30px;border:1px solid var(--line);border-radius:20px;color:var(--text2)}.error button{margin-top:15px;background:var(--accent);border:0;border-radius:20px;padding:10px 18px;cursor:pointer}
@media(max-width:850px){.page{grid-template-columns:1fr}.media-panel{position:relative;top:auto}.main-media{height:58vh}.title{font-size:40px}}
@media(max-width:520px){.page{padding:20px 16px 50px}.main-media{min-height:330px;height:55vh}.info-grid,.attributes{grid-template-columns:1fr}.actions{flex-wrap:wrap}.wish{height:48px}.topbar{padding:0 16px}}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading product…</div></div>
<div class="toast" id="toast"></div>
<script src="product.js"></script>
</body>
</html>
