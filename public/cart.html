<!DOCTYPE html>
<html lang="en">
<head>
<script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReelMart - Cart</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #F5A623;
            --accent2: #E8522A;
            --dark: #141414;
            --surface: #1E1E1E;
            --surface2: #2A2A2A;
            --text: #F0EEE8;
            --text2: #AAAAAA;
            --border: #333;
            --success: #3DAA6A;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
        }

        nav {
            height: 70px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(20,20,20,0.97);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: 900;
        }

        .logo span {
            color: var(--accent);
        }

        .back-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text);
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            margin-bottom: 30px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            background: var(--surface);
            border: 1px solid #2c2c2c;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .product-image {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--surface2);
            flex-shrink: 0;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-category {
            color: var(--text2);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .item-price {
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
        }

        .quantity {
            display: flex;
            align-items: center;
            background: var(--surface2);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #3a3a3a;
        }

        .quantity button {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
        }

        .quantity button:hover {
            background: #3a3a3a;
        }

        .quantity span {
            width: 35px;
            text-align: center;
            font-size: 13px;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            margin-top: 7px;
        }

        .remove-btn:hover {
            color: var(--accent2);
        }

        .summary {
            background: var(--surface);
            border: 1px solid #2c2c2c;
            border-radius: 14px;
            padding: 22px;
            position: sticky;
            top: 95px;
        }

        .summary h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 13px;
            color: var(--text2);
            font-size: 13px;
        }

        .summary-total {
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 600;
        }

        .summary-total span:last-child {
            color: var(--accent);
        }

        .checkout-btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: var(--accent);
            color: #111;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .checkout-btn:hover {
            transform: scale(1.02);
        }

        .empty {
            background: var(--surface);
            border-radius: 14px;
            padding: 60px 20px;
            text-align: center;
            color: var(--text2);
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .shop-btn {
            margin-top: 20px;
            padding: 11px 22px;
            border: none;
            border-radius: 22px;
            background: var(--accent);
            color: #111;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: var(--accent);
            color: #111;
            padding: 10px 20px;
            border-radius: 25px;
            opacity: 0;
            transition: 0.3s;
            z-index: 100;
            font-size: 13px;
            font-weight: 500;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media(max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }
        }

        @media(max-width: 550px) {
            .cart-item {
                flex-wrap: wrap;
            }

            .product-image {
                width: 85px;
                height: 85px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        Reel<span>Mart</span>
    </div>

    <button class="back-btn" onclick="goHome()">
        ← Continue Shopping
    </button>

</nav>


<div class="container">

    <h1 class="page-title">
        Your Cart
    </h1>

    <div class="layout">

        <div id="cart-items" class="cart-items"></div>

        <div class="summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Items</span>
                <span id="item-count">0</span>
            </div>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₦0</span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <span id="delivery">₦0</span>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <span id="total">₦0</span>
            </div>

            <button
                class="checkout-btn"
                onclick="goToCheckout()"
            >
                Proceed to Checkout
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script src="cart.js"></script>

</body>
</html>
