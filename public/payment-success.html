<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — ReelMart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--accent:#F5A623;--dark:#0E0E0E;--surface:#1A1A1A;--text:#F0EEE8;--text2:#888;--success:#3DAA6A}
  body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:0.5px solid #2A2A2A;border-radius:16px;
    padding:48px 40px;max-width:480px;width:100%;text-align:center}
  .icon{width:80px;height:80px;border-radius:50%;background:rgba(61,170,106,0.15);
    border:2px solid var(--success);display:flex;align-items:center;justify-content:center;
    font-size:36px;margin:0 auto 24px}
  .title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;margin-bottom:8px}
  .sub{font-size:14px;color:var(--text2);margin-bottom:6px}
  .order-num{font-size:18px;font-weight:600;color:var(--accent);margin:16px 0 8px}
  .status{display:inline-block;background:rgba(61,170,106,0.15);color:var(--success);
    padding:4px 14px;border-radius:20px;font-size:12px;font-weight:500;margin-bottom:28px}
  .btn{display:block;padding:13px;border-radius:24px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;
    transition:transform 0.15s;margin-bottom:10px}
  .btn:hover{transform:scale(1.02)}
  .btn-primary{background:var(--accent);color:#111;border:none}
  .btn-ghost{background:transparent;color:var(--text2);border:0.5px solid #333}
  .loading{color:var(--text2);font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <div class="title" id="title">Verifying payment...</div>
  <div class="sub" id="sub">Please wait while we confirm your payment</div>
  <div class="order-num" id="order-num"></div>
  <div id="status-pill"></div>
  <a href="/" class="btn btn-primary" id="home-btn" style="display:none">Continue shopping</a>
  <a href="/orders.html" class="btn btn-ghost" id="orders-btn" style="display:none">View my orders</a>
</div>

<script>
async function verifyPayment() {
  const params    = new URLSearchParams(window.location.search);
  const reference = params.get('reference') || params.get('trxref');
  const token     = localStorage.getItem('reelmartToken');

  if (!reference) {
    document.getElementById('icon').textContent  = '❌';
    document.getElementById('title').textContent = 'No payment reference found';
    document.getElementById('sub').textContent   = 'Something went wrong with your payment.';
    showButtons();
    return;
  }

  if (!token) {
    window.location.href = '/auth.html';
    return;
  }

  try {
    const res  = await fetch(`/api/payments/verify/${reference}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();

    if (data.success) {
      document.getElementById('icon').textContent       = '🎉';
      document.getElementById('title').textContent      = 'Payment successful!';
      document.getElementById('sub').textContent        = 'Thank you for shopping on ReelMart';
      document.getElementById('order-num').textContent  =
        data.order ? 'Order #' + data.order.orderNumber : '';
      document.getElementById('status-pill').innerHTML  =
        '<div class="status">✓ Payment confirmed</div>';

      // Clear cart
      localStorage.removeItem('reelmartCart');

    } else {
      document.getElementById('icon').textContent  = '⚠️';
      document.getElementById('title').textContent = 'Payment could not be verified';
      document.getElementById('sub').textContent   = data.message || 'Please contact support.';
    }

  } catch (err) {
    document.getElementById('icon').textContent  = '❌';
    document.getElementById('title').textContent = 'Verification failed';
    document.getElementById('sub').textContent   = 'Could not connect to server.';
  }

  showButtons();
}

function showButtons() {
  document.getElementById('home-btn').style.display   = 'block';
  document.getElementById('orders-btn').style.display = 'block';
}

verifyPayment();
</script>
</body>
</html>
